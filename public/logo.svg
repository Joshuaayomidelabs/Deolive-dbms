    <!-- Ring 4 (Small Core - r=30, 12 dots) -->
    <g fill="#439300">
      <circle cx="275" cy="180" r="2.8"/>
      <circle cx="271" cy="195" r="2.8"/>
      <circle cx="260" cy="206" r="2.8"/>
      <circle cx="245" cy="210" r="2.8"/>
      <circle cx="230" cy="206" r="2.8"/>
      <circle cx="219" cy="195" r="2.8"/>
      <circle cx="215" cy="180" r="2.8"/>
      <circle cx="219" cy="165" r="2.8"/>
      <circle cx="230" cy="154" r="2.8"/>
      <circle cx="245" cy="150" r="2.8"/>
      <circle cx="260" cy="154" r="2.8"/>
      <circle cx="271" cy="165" r="2.8"/>
