    <!-- 3. RIGHT: 'C' Arc Section -->
    <!-- Black inner crescent wedge -->
    <path d="M 350 185 L 350 102 A 80 80 0 0 1 405 125 L 382 148 A 45 45 0 0 0 350 137 Z" fill="#0D0D0D"/>

    <!-- Vibrant Green Curved Arc 'C' -->
    <path d="M 350 185 L 350 102 A 85 85 0 0 1 438 102 L 430 128 A 60 60 0 0 0 350 148 L 350 185 Z" fill="#56B900"/>
    <path d="M 370 102 A 80 80 0 0 1 438 102 L 434 118 A 65 65 0 0 0 380 118 Z" fill="#489C00"/>

    <!-- Horizontal Speed / DBMS Data Stream Lines -->
    <g fill="#0D0D0D">
      <!-- Line 1 -->
      <polygon points="315,188 355,188 351,192 315,192"/>
      <!-- Line 2 -->
      <polygon points="325,198 375,198 370,203 325,203"/>
      <!-- Line 3 -->
      <polygon points="338,209 405,209 399,215 338,215"/>
      <!-- Line 4 -->
      <polygon points="355,221 430,221 423,227 355,227"/>
      <!-- Line 5 -->
      <polygon points="375,233 445,233 438,239 375,239"/>
      <!-- Line 6 (lowest line) -->
      <polygon points="398,245 435,245 429,250 398,250"/>
    </g>
  </g>

  <!-- Typography below: DE-OLIVE CONCEPT -->
  <text x="260" y="335" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="27" 
        font-weight="700" 
        letter-spacing="0.22em" 
        fill="#0D0D0D">DE–OLIVE CONCEPT</text>
</svg>
